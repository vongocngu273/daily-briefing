name: Daily Briefing

on:
  schedule:
    # Chính: Cloudflare Worker gọi lúc 07:05 VN (worker/wrangler.toml).
    # Dự phòng khi GitHub/Cloudflare trục trặc: 07:17 và 07:41 VN; job "check" bỏ qua nếu đã có bản tin.
    - cron: "17 0 * * *"
    - cron: "41 0 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Gọi tự động (Cloudflare) – bỏ qua nếu hôm nay đã có bản tin"
        required: false
        default: "false"
      source:
        description: "button = bấm Update trên trang (chạy lại giữa ngày, không gửi Telegram)"
        required: false
        default: "manual"

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  # GitHub có thể chạy lịch hẹn trễ cả tiếng. Nếu hôm nay đã có bản tin (chạy tay hoặc chạy sớm hơn)
  # thì lần chạy theo lịch đến trễ bỏ qua, để không gọi Gemini và không gửi Telegram hai lần.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/page.json
      - id: done
        run: |
          today=$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)
          have=$(python3 -c "import json;print(json.load(open('data/page.json')).get('date_compact',''))" 2>/dev/null || true)
          auto=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then auto=true; fi
          if [ "$auto" = "true" ] && [ "$have" = "$today" ]; then
            echo "Hôm nay ($today) đã có bản tin, bỏ qua lần chạy theo lịch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          WEATHER_LOCATION_NAME: ${{ secrets.WEATHER_LOCATION_NAME }}
          BRIEFING_MODE: ${{ inputs.source == 'button' && 'refresh' || 'morning' }}
        run: python -m src.main

      - name: Verify output
        run: test -s docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/og.png docs/live.json data/history.json data/page.json data/trends.json data/live.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "chore: update daily briefing [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # [skip ci] also skips the automatic Pages build, so request one explicitly.
      - name: Trigger Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      # Only reached after a successful push; give Pages time to deploy before pinging the phone.
      - name: Wait for Pages deploy
        if: inputs.source != 'button'
        run: sleep 45

      - name: Notify Telegram
        if: inputs.source != 'button'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m src.notify
